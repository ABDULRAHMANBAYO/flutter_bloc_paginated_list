name: flutter_bloc_paginated_list
description: >-
  A reusable, state-shape-agnostic paginated ListView for Flutter driven by any
  BLoC or Cubit. Handles infinite scroll, pull-to-refresh, and loading/empty/
  error states with fully customizable builders.
version: 0.1.0
repository: https://github.com/ABDULRAHMANBAYO/flutter_bloc_paginated_list
issue_tracker: https://github.com/ABDULRAHMANBAYO/flutter_bloc_paginated_list/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ">=8.0.0 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
